name: EKS Onboarding CI/CD

on:
  workflow_dispatch:  # Manual trigger
  # push:
  #   branches:
  #     - main  # Uncomment to run on push

permissions:
  id-token: write
  contents: read

jobs:
  eks-onboard:
    runs-on: ubuntu-latest

    env:
      VINYLDNS_API_URL: https://api.vinyldns.comcast.net:9443
      VAULT_ADDR: https://or.vault.comcast.com/
      VINYLDNS_DEFAULT_TTL: 300
      VINYLDNS_CNAME_TARGET_HOSTNAME: esk1-ase2.daas.comcast.net
      VINYLDNS_DOMAIN_SUFFIX: observability.comcast.net

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::270839351042:role/GittoAWS
          aws-region: ap-southeast-2 # or your region

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl unzip
          pip install jinja2 validators git+https://github.com/vinyldns/vinyldns-python.git

      - name: Install Vault CLI
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::270839351042:role/GittoAWS
          aws-region: ap-southeast-2 # or your region

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy (example - get EKS clusters)
        run: aws eks list-clusters

      - name: Restore kubeconfig file
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.EKS_KUBECONFIG }}" > ~/.kube/kube_ingest_apac
          chmod 600 ~/.kube/kube_ingest_apac


      - name: Setup Vault token
        run: echo "${{ secrets.VAULT_TOKEN }}" > ~/.vault-token

      - name: Make scripts executable
        run: chmod +x execute-eks-efs-apac-script.sh

      - name: Run onboarding script
        env:
          HOME: ${{ github.workspace }}
        run: ../AWS_AUTOMATION/execute-eks-efs-apac-script.sh

      - name: Upload onboarding logs
        uses: actions/upload-artifact@v4
        with:
          name: eks-onboarding-logs
          path: ../../ci/deployment/aws/prod/apac-ase02/logs/
